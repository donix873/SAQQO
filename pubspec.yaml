name: saqgo
description: Privacy-first urban mobility companion for Arkalyk.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pointer_interceptor: ^0.10.1+2
  flutter_svg: ^2.2.1
  url_launcher: ^6.3.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  sensors_plus: ^7.0.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0
  cryptography: ^2.7.0
  share_plus: ^12.0.0
  battery_plus: ^7.0.0
  http: ^1.5.0
  yandex_maps_mapkit_lite: ^4.45.0

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  fonts:
    - family: SaqgoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
  generate: true
  assets:
    - assets/icons/
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/saqgo_app_icon_1024.png
  min_sdk_android: 26
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B1220"
  image: assets/branding/saqgo_splash_symbol_1024.png
  android_12:
    color: "#0B1220"
    image: assets/branding/saqgo_splash_symbol_1024.png
