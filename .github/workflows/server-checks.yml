name: SAQGO server checks

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-checks.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-checks.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: docker build --tag saqgo-api:test .
