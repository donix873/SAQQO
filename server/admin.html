<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAQGO · Moderation</title>
<style>body{background:#09111e;color:#f4f7fc;font:16px system-ui;margin:0}main{max-width:960px;margin:40px auto;padding:24px}section,article{background:#152236;border:1px solid #26374c;border-radius:20px;padding:24px;margin:16px 0}input,button,select{font:inherit;padding:12px;margin:6px;border-radius:12px;border:1px solid #3a8bff;background:#1e314a;color:inherit}button{cursor:pointer}h1{font-size:28px}p{color:#a5b3c7}.hidden{display:none}#status{color:#28d6d0}label{display:block}</style>
<main><select id="locale" aria-label="Язык / Тіл"><option value="ru">Русский</option><option value="kk">Қазақша</option></select><h1>SAQGO</h1><p id="intro"></p><section id="login"><h2 id="heading"></h2><form id="form"><label id="password-label" for="password"></label><input id="password" type="password" autocomplete="current-password" required><label id="otp-label" for="otp"></label><input id="otp" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required><button id="submit" type="submit"></button></form></section><section id="tools" class="hidden"><button id="refresh"></button><button id="audit"></button><button id="logout"></button></section><p id="status" role="status"></p><div id="queue"></div></main>
<script>
const words={ru:{intro:'Очередь обезличенных наблюдений. Нет доступа к личным трекам. Подтверждение требует независимой проверки источника.',heading:'Вход модератора',password:'Пароль',otp:'Код 2FA',submit:'Войти',refresh:'Обновить очередь',audit:'Журнал решений',logout:'Выйти',approve:'Подтвердить',reject:'Отклонить',reason:'Основание решения (минимум 10 символов)',source:'Проверенный источник',empty:'Нет наблюдений',error:'Запрос не выполнен. Проверьте доступ, 2FA и настройки API.',done:'Решение сохранено'},kk:{intro:'Анонимделген бақылаулар кезегі. Жеке жолдарға қолжетімділік жоқ. Растау үшін дереккөзді тәуелсіз тексеру қажет.',heading:'Модератор кіруі',password:'Құпиясөз',otp:'2FA коды',submit:'Кіру',refresh:'Кезекті жаңарту',audit:'Шешімдер журналы',logout:'Шығу',approve:'Растау',reject:'Қабылдамау',reason:'Шешім негізі (кемінде 10 таңба)',source:'Тексерілген дереккөз',empty:'Бақылаулар жоқ',error:'Сұрау орындалмады. Рұқсатты, 2FA мен API баптауларын тексеріңіз.',done:'Шешім сақталды'}};
const $=id=>document.getElementById(id);let token='';let expiry;let lang='ru';
function translate(){lang=$('locale').value;document.documentElement.lang=lang;for(const id of ['intro','heading','submit','refresh','audit','logout'])$(id).textContent=words[lang][id];$('password-label').textContent=words[lang].password;$('otp-label').textContent=words[lang].otp;}
$('locale').onchange=translate;translate();
function exit(){token='';clearTimeout(expiry);$('queue').replaceChildren();$('tools').classList.add('hidden');$('login').classList.remove('hidden');$('password').value='';$('otp').value='';}
async function api(path,body){const response=await fetch('/v1'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});if(!response.ok){if(response.status===401)exit();throw Error(words[lang].error);}return response.json();}
function element(tag,text){const el=document.createElement(tag);el.textContent=text;return el;}
async function refresh(){try{const data=await api('/admin/observations');$('queue').replaceChildren();if(!data.features.length)$('queue').append(element('p',words[lang].empty));for(const feature of data.features){const card=element('article','');const p=feature.properties;card.append(element('h3',p.category+' · '+p.status));card.append(element('p',feature.geometry.coordinates.join(', ')+' · '+p.observed_at+' · '+Math.round(p.confidence*100)+'%'));const reason=element('input','');reason.placeholder=words[lang].reason;reason.minLength=10;const source=element('input','');source.placeholder=words[lang].source;card.append(reason,source);for(const [status,label] of [['verified','approve'],['rejected','reject']]){const button=element('button',words[lang][label]);button.onclick=async()=>{if(reason.value.trim().length<10||source.value.trim().length<3){$('status').textContent=words[lang].reason;return;}try{await api('/admin/observations/'+encodeURIComponent(feature.id),{status,reason:reason.value.trim(),source:source.value.trim(),expires_in_hours:24});$('status').textContent=words[lang].done;await refresh();}catch(e){$('status').textContent=e.message;}};card.append(button);}$('queue').append(card);}}catch(e){$('status').textContent=e.message;}}
$('form').onsubmit=async event=>{event.preventDefault();try{const result=await api('/admin/login',{password:$('password').value,otp:$('otp').value});token=result.access_token;expiry=setTimeout(exit,result.expires_in*1000);$('password').value='';$('otp').value='';$('login').classList.add('hidden');$('tools').classList.remove('hidden');await refresh();}catch(e){$('status').textContent=e.message;}};
$('refresh').onclick=refresh;$('logout').onclick=exit;$('audit').onclick=async()=>{try{const data=await api('/admin/audit');$('queue').replaceChildren();for(const action of data.actions)$('queue').append(element('article',action.decision+' · '+action.reason+' · '+action.source+' · '+new Date(action.created_at*1000).toLocaleString(lang)));}catch(e){$('status').textContent=e.message;}};
</script></html>
